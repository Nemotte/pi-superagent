name: verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run release:bundle
      - uses: actions/upload-artifact@v4
        with:
          name: portable-candidate
          path: .artifacts/release/
          if-no-files-found: error
          retention-days: 7
  portable:
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux/x64
          - os: ubuntu-24.04-arm
            target: linux/arm64
          - os: macos-15-intel
            target: darwin/x64
          - os: macos-15
            target: darwin/arm64
          - os: windows-2025
            target: win32/x64
          - os: windows-11-arm
            target: win32/arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          architecture: ${{ endsWith(matrix.target, '/arm64') && 'arm64' || 'x64' }}
      - uses: actions/download-artifact@v4
        with:
          name: portable-candidate
          path: .artifacts/release
      # No workspace npm ci/build here: only the release bundle may supply runtime dependencies.
      - run: node -e "if(process.platform+'/'+process.arch!==process.env.EXPECTED_TARGET) process.exit(1)"
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
      - run: npm run test:install -- --bundle .artifacts/release --audit > .artifacts/install.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-${{ matrix.os }}
          path: .artifacts/install.log
          retention-days: 7
  # The published bundle is only as trustworthy as both gates: the full suite on Linux and the portable target matrix.
  verified-bundle:
    needs: [test, portable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: portable-candidate
          path: release
      - uses: actions/upload-artifact@v4
        with:
          name: portable-verified
          path: release/
          if-no-files-found: error
          retention-days: 7
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run test:integration
      - run: npm run test:security
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web
      - run: npm run test:stability -- 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stability-${{ matrix.os }}
          path: .artifacts/stability-*/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
